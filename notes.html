<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Reader · BCA</title>
  <link rel="stylesheet" href="css/notes.css">
</head>
<body>
  <div id="progressBar"></div>
  <nav class="navbar"><div class="container nav-inner"><a href="index.html" class="logo">BCA•Notes</a></div></nav>
  <main class="container notes-reader">
    <div id="noteContent" style="margin-top:20px;"></div>
    <div id="premiumLock" style="display:none; backdrop-filter: blur(12px); background: rgba(255,255,255,0.8); border-radius:24px; padding:24px; margin-top:20px;">
      <h3>🔒 Unlock Full Notes</h3>
      <input id="leadName" placeholder="Name" style="width:100%; padding:12px; margin:8px 0; border-radius:12px; border:1px solid #ccc;">
      <input id="leadMobile" placeholder="Mobile" style="width:100%; padding:12px; margin:8px 0; border-radius:12px;">
      <button id="unlockBtn" style="background:#0891b2; color:white; border:none; padding:12px; border-radius:20px; width:100%;">Unlock Now</button>
    </div>
  </main>
  <script src="js/notes.js"></script>
</body>
</html>
